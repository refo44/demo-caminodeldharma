# WordPress production code deploy, started by an approved component tag (ADR 0048).
#
#   theme-vX.Y.Z   -> deploys only the theme
#   plugin-vX.Y.Z  -> deploys only the plugin
#
# A workflow_dispatch run repeats an existing component tag. It uses the guards
# in this workflow and the component files from that tag. It does not deploy a
# branch. Nothing here creates, moves or deletes a tag, publishes a release, or
# touches content. The destination must be the canonical production document
# root; tools/release/check-production-target.sh refuses every other path.
# Operator runbook: docs/operations/wordpress-production-cd.md
name: deploy-production

on:
  push:
    tags:
      - 'theme-v*'
      - 'plugin-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Component tag already on main
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # The trigger only narrows the event. The tag, its SemVer and its place in
  # main history are checked here, before any gate or secret is involved.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      tag: ${{ steps.commit.outputs.tag }}
      component: ${{ steps.resolve.outputs.component }}
      version: ${{ steps.resolve.outputs.version }}
      source_dir: ${{ steps.resolve.outputs.source_dir }}
      target_rel: ${{ steps.resolve.outputs.target_rel }}
      slug: ${{ steps.resolve.outputs.slug }}
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # TAGGED_SHA is the commit the tag resolves to. A tag push must have
      # checked out that commit. A manual run checks out this workflow and
      # reads the component from the tag.
      - name: The tag resolves to a commit
        id: commit
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            [[ "${TAG}" =~ ^(theme|plugin)-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
              echo "::error::dispatch tag is not a component tag"
              exit 1
            }
          else
            [ "${GITHUB_REF_TYPE}" = "tag" ] || { echo "::error::not a tag event"; exit 1; }
          fi
          git fetch --no-tags origin "+refs/tags/${TAG}:refs/tags/${TAG}"
          sha=$(git rev-parse --verify "refs/tags/${TAG}^{commit}")
          if [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]; then
            [ "$(git rev-parse HEAD)" = "${sha}" ] || {
              echo "::error::tag ${TAG} resolves to ${sha}, not the checked-out commit"
              exit 1
            }
          fi
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
      - name: Tag namespace, SemVer and component version
        id: resolve
        run: |
          sha="${{ steps.commit.outputs.sha }}"
          tree=$(mktemp -d)
          git archive "${sha}" | tar -x -C "${tree}"
          resolved=$(bash tools/release/resolve-release.sh "${TAG}" "${tree}")
          rm -rf "${tree}"
          printf '%s\n' "${resolved}" | sed -E 's/^([A-Z_]+)=/\L\1=/' >> "${GITHUB_OUTPUT}"
          printf '%s\n' "${resolved}"
      - name: The tagged commit belongs to main history
        env:
          TAGGED_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git rev-parse --verify origin/main >/dev/null || {
            echo "::error::origin/main is not available for the ancestry check"
            exit 1
          }
          git merge-base --is-ancestor "${TAGGED_SHA}" origin/main || {
            echo "::error::${TAGGED_SHA} is not contained in main history"
            exit 1
          }
      - name: The component holds no symlinks
        env:
          TAGGED_SHA: ${{ steps.commit.outputs.sha }}
          SOURCE_DIR: ${{ steps.resolve.outputs.source_dir }}
        run: bash tools/release/check-no-symlinks.sh "${TAGGED_SHA}" "${SOURCE_DIR}"

  php:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-
      - run: composer install --prefer-dist --no-progress --no-interaction
      - run: composer test
      - run: composer lint:phpcs

  css:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint:css

  # Runs only with validation and both gates green. The production environment
  # holds the SSH secrets. Runs are serialized and never cancelled mid-sync.
  deploy:
    needs: [validate, php, css]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
    concurrency:
      group: production-wordpress-deploy
      cancel-in-progress: false
    env:
      TAG: ${{ needs.validate.outputs.tag }}
      TAGGED_SHA: ${{ needs.validate.outputs.sha }}
      COMPONENT: ${{ needs.validate.outputs.component }}
      VERSION: ${{ needs.validate.outputs.version }}
      SOURCE_DIR: ${{ needs.validate.outputs.source_dir }}
      TARGET_REL: ${{ needs.validate.outputs.target_rel }}
      SLUG: ${{ needs.validate.outputs.slug }}
      PRODUCTION_URL: https://caminodeldharma.org
      SSH_HOST: ${{ vars.PRODUCTION_SSH_HOST }}
      SSH_PORT: ${{ vars.PRODUCTION_SSH_PORT }}
      SSH_USER: ${{ vars.PRODUCTION_SSH_USER }}
      PRODUCTION_WP_ROOT: ${{ vars.PRODUCTION_WP_ROOT }}
      SSH_CONFIG: ${{ github.workspace }}/../production_ssh/config
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Production configuration and target guard
        run: |
          for name in SSH_HOST SSH_PORT SSH_USER PRODUCTION_WP_ROOT COMPONENT VERSION SOURCE_DIR TARGET_REL SLUG; do
            [ -n "${!name}" ] || { echo "::error::${name} is empty"; exit 1; }
          done
          [[ "${SSH_PORT}" =~ ^[0-9]{1,5}$ ]] || { echo "::error::SSH port is not numeric"; exit 1; }
          [[ "${SSH_HOST}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || { echo "::error::SSH host is not a plain host name"; exit 1; }
          [[ "${SSH_USER}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || { echo "::error::SSH user is not a plain user name"; exit 1; }
          bash tools/release/check-production-target.sh "${PRODUCTION_WP_ROOT}" "${TARGET_REL}"

      - name: Component artifact and checksum
        run: |
          artifact="${RUNNER_TEMP}/cdd-${COMPONENT}-${VERSION}.tar.gz"
          stage="${RUNNER_TEMP}/stage"
          depth=$(awk -F/ '{print NF}' <<< "${SOURCE_DIR}")
          git archive --format=tar.gz --output="${artifact}" "${TAGGED_SHA}" -- "${SOURCE_DIR}"
          rm -rf "${stage}"
          mkdir -p "${stage}"
          tar -xzf "${artifact}" --strip-components="${depth}" -C "${stage}"
          [ -f "${stage}/style.css" ] || [ -f "${stage}/camino-del-dharma-core.php" ] || {
            echo "::error::the artifact does not hold the component entry file"
            exit 1
          }
          sha256=$(sha256sum "${artifact}" | awk '{print $1}')
          echo "STAGE_DIR=${stage}" >> "${GITHUB_ENV}"
          {
            echo "### Production deploy artifact"
            echo "- component: ${COMPONENT}"
            echo "- version: ${VERSION}"
            echo "- tag: ${TAG}"
            echo "- commit: ${TAGGED_SHA}"
            echo "- artifact: $(basename "${artifact}")"
            echo "- sha256: ${sha256}"
          } | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: SSH with verified host key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          [ -n "${SSH_PRIVATE_KEY}" ] || { echo "::error::PRODUCTION_SSH_PRIVATE_KEY is empty"; exit 1; }
          [ -n "${SSH_KNOWN_HOSTS}" ] || { echo "::error::PRODUCTION_SSH_KNOWN_HOSTS is empty"; exit 1; }
          dir=$(dirname "${SSH_CONFIG}")
          umask 077
          mkdir -p "${dir}"
          printf '%s\n' "${SSH_PRIVATE_KEY}" > "${dir}/key"
          printf '%s\n' "${SSH_KNOWN_HOSTS}" > "${dir}/known_hosts"
          host_id="${SSH_HOST}"
          [ "${SSH_PORT}" = "22" ] || host_id="[${SSH_HOST}]:${SSH_PORT}"
          ssh-keygen -F "${host_id}" -f "${dir}/known_hosts" >/dev/null || {
            echo "::error::known_hosts has no entry for ${host_id}"
            exit 1
          }
          {
            echo "Host *"
            echo "  Port ${SSH_PORT}"
            echo "  IdentityFile ${dir}/key"
            echo "  IdentitiesOnly yes"
            echo "  BatchMode yes"
            echo "  StrictHostKeyChecking yes"
            echo "  UserKnownHostsFile ${dir}/known_hosts"
            echo "  ServerAliveInterval 30"
          } > "${SSH_CONFIG}"

      - name: Production preflight
        id: preflight
        run: |
          guard=$(bash tools/release/check-production-target.sh "${PRODUCTION_WP_ROOT}" "${TARGET_REL}")
          target_dir=$(printf '%s\n' "${guard}" | sed -n 's/^TARGET_DIR=//p')
          required=$(printf '%s\n' "${guard}" | sed -n 's/^REQUIRED_REAL_ROOT=//p')
          [ -n "${target_dir}" ] || { echo "::error::production target is empty"; exit 1; }
          [ -n "${required}" ] || { echo "::error::production root guard is empty"; exit 1; }
          before=$(ssh -F "${SSH_CONFIG}" "${SSH_USER}@${SSH_HOST}" bash -s -- "${PRODUCTION_WP_ROOT}" "${target_dir}" "${PRODUCTION_URL}" "${required}" <<'REMOTE'
          set -euo pipefail
          root=$1; target=$2; url=$3; required=$4
          fail() { echo "preflight: $*" >&2; exit 1; }
          [ -n "${required}" ] || fail "production root guard is empty"
          [ -d "${root}" ] || fail "WordPress root is missing"
          [ -d "${target}" ] || fail "component directory is missing"
          real_root=$(cd "${root}" && pwd -P)
          real_target=$(cd "${target}" && pwd -P)
          [ "${real_root}" = "${required}" ] || fail "resolved root is not the canonical production document root"
          case "${real_target}" in
            "${required}"/wp-content/themes/camino-del-dharma | "${required}"/wp-content/plugins/camino-del-dharma-core) ;;
            *) fail "resolved component directory is not a first-party component" ;;
          esac
          wp_cli() { wp --path="${root}" --skip-plugins --skip-themes "$@" < /dev/null; }
          wp_cli core is-installed || fail "no WordPress installation at the root"
          [ "$(wp_cli eval 'echo wp_get_environment_type();')" = "production" ] || fail "environment type is not production"
          home=$(wp_cli option get home)
          [ "${home%/}" = "${url}" ] || fail "home URL is not the canonical URL"
          abspath=$(wp_cli eval 'echo ABSPATH;')
          [ "$(cd "${abspath}" && pwd -P)" = "${real_root}" ] || fail "ABSPATH is not the configured root"
          if [ -f "${root}/.htaccess" ]; then sha256sum "${root}/.htaccess" | cut -d' ' -f1; else echo absent; fi
          REMOTE
          )
          echo "htaccess_before=${before}" >> "${GITHUB_OUTPUT}"
          echo "Production target identified; root .htaccess fingerprint recorded."

      - name: Sync the component to production
        run: |
          guard=$(bash tools/release/check-production-target.sh "${PRODUCTION_WP_ROOT}" "${TARGET_REL}")
          target_dir=$(printf '%s\n' "${guard}" | sed -n 's/^TARGET_DIR=//p')
          required=$(printf '%s\n' "${guard}" | sed -n 's/^REQUIRED_REAL_ROOT=//p')
          [ -n "${target_dir}" ] && [ -n "${STAGE_DIR}" ] && [ -d "${STAGE_DIR}" ] || { echo "::error::empty sync path"; exit 1; }
          [ -n "${required}" ] || { echo "::error::production root guard is empty"; exit 1; }
          ssh -F "${SSH_CONFIG}" "${SSH_USER}@${SSH_HOST}" bash -s -- "${target_dir}" "${required}" <<'REMOTE'
          set -euo pipefail
          target=$1; required=$2
          fail() { echo "sync: $*" >&2; exit 1; }
          [ -n "${required}" ] || fail "production root guard is empty"
          [ -d "${target}" ] || fail "component directory is missing"
          real_target=$(cd "${target}" && pwd -P)
          case "${real_target}" in
            "${required}"/wp-content/themes/camino-del-dharma | "${required}"/wp-content/plugins/camino-del-dharma-core) ;;
            *) fail "resolved component directory is not a first-party component" ;;
          esac
          REMOTE
          rsync --recursive --times --delete --chmod=D755,F644 --itemize-changes \
            -e "ssh -F ${SSH_CONFIG}" \
            "${STAGE_DIR}/" "${SSH_USER}@${SSH_HOST}:${target_dir}/"

      - name: Purge the production page cache
        run: |
          if ssh -F "${SSH_CONFIG}" "${SSH_USER}@${SSH_HOST}" bash -s -- "${PRODUCTION_WP_ROOT}" <<'REMOTE'
          set -euo pipefail
          wp --path="$1" --skip-themes litespeed-purge all < /dev/null
          REMOTE
          then
            echo "Production page cache purged."
          else
            echo "::warning::could not purge the LiteSpeed page cache; purge it in hPanel (docs/operations/wordpress-production-cd.md)"
          fi

      - name: Post-deploy verification
        env:
          HTACCESS_BEFORE: ${{ steps.preflight.outputs.htaccess_before }}
        run: |
          result=$(ssh -F "${SSH_CONFIG}" "${SSH_USER}@${SSH_HOST}" bash -s -- "${PRODUCTION_WP_ROOT}" "${COMPONENT}" "${SLUG}" <<'REMOTE'
          set -euo pipefail
          root=$1; component=$2; slug=$3
          wp_cli() { wp --path="${root}" --skip-plugins --skip-themes "$@" < /dev/null; }
          echo "environment=$(wp_cli eval 'echo wp_get_environment_type();')"
          if [ "${component}" = "theme" ]; then
            echo "installed=$(wp_cli theme get "${slug}" --field=version)"
            active=no
            [ "$(wp_cli theme list --status=active --field=name)" != "${slug}" ] || active=yes
            echo "active=${active}"
          else
            echo "installed=$(wp_cli plugin get "${slug}" --field=version)"
            echo "active=$([ "$(wp_cli plugin get "${slug}" --field=status)" = active ] && echo yes || echo no)"
          fi
          if [ -f "${root}/.htaccess" ]; then echo "htaccess=$(sha256sum "${root}/.htaccess" | cut -d' ' -f1)"; else echo "htaccess=absent"; fi
          REMOTE
          )
          echo "${result}"
          field() { sed -n "s/^$1=//p" <<< "${result}"; }
          [ "$(field environment)" = "production" ] || { echo "::error::environment is no longer production"; exit 1; }
          [ "$(field installed)" = "${VERSION}" ] || { echo "::error::installed ${COMPONENT} version $(field installed) is not ${VERSION}"; exit 1; }
          [ "$(field htaccess)" = "${HTACCESS_BEFORE}" ] || { echo "::error::root .htaccess changed"; exit 1; }
          [ "$(field active)" = "yes" ] || echo "::warning::the ${COMPONENT} ${SLUG} is not active on production (not changed by this deploy)"
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 --retry 3 --retry-delay 5 "${PRODUCTION_URL}/")
          if [ "${code}" = "403" ]; then
            echo "::warning::production answered HTTP 403"
          else
            [ "${code}" -ge 200 ] && [ "${code}" -lt 400 ] || { echo "::error::production answered HTTP ${code}"; exit 1; }
          fi
          echo "Verified ${COMPONENT} ${VERSION} on production (HTTP ${code})."

      - name: Remove SSH material
        if: always()
        run: rm -rf "$(dirname "${SSH_CONFIG}")"
