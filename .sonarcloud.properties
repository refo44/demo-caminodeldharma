# Automatic Analysis (GitHub App). This is not sonar-project.properties.
# While Automatic Analysis is ON, Sonar ignores sonar-project.properties.
# Do not add a scanner in CI: duplicate analyses fail the GitHub check.
# Coverage is not imported; 0.0% is expected, not a missing suite.
# No wildcards (*, **, ?) in any property.
# Automatic Analysis reads this file from the default branch only.
#
# Scope is WordPress first-party only (plugin + FSE theme). The static site is out.
# Do not add assets/, scripts/, HTML, or docs/.
# See docs/guia-pruebas-plugin-theme-fse.md and ADR 0038.

sonar.sources=wordpress/wp-content/plugins/camino-del-dharma-core,wordpress/wp-content/themes/camino-del-dharma
sonar.tests=tests
sonar.exclusions=wordpress/wp-content/plugins/camino-del-dharma-core/vendor
sonar.sourceEncoding=UTF-8
