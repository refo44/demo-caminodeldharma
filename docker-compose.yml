# Local WordPress development environment (ADR 0023, docs/docker-wordpress-playbook.md).
#
# Usage:
#   cp .env.example .env        # fill in real values first (gitignored)
#   docker compose up -d        # WordPress at http://localhost:${WORDPRESS_PORT:-8080}
#   docker compose run --rm wpcli wp <command>
#   docker compose down         # stop; add -v to destroy DB/core volumes (disposable)
#
# Image tags pinned to Hostinger production parity confirmed 2026-08-01:
# WordPress 7.1 on PHP 8.3 (Hostinger PHP 8.3.30) and MariaDB 11.8.8
# (see docs/docker-wordpress-playbook.md §2). Official WordPress images do
# not publish PHP patch-level tags; re-verify after `docker compose pull`.
# Local test bench only — this file plays no role in any deployment (ADR 0015).

name: camino-del-dharma

services:
  db:
    image: mariadb:11.8.8
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:?define MARIADB_DATABASE en .env}
      MARIADB_USER: ${MARIADB_USER:?define MARIADB_USER en .env}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?define MARIADB_PASSWORD en .env}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?define MARIADB_ROOT_PASSWORD en .env}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 12

  wordpress:
    image: wordpress:7.1-php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WORDPRESS_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${MARIADB_DATABASE:?define MARIADB_DATABASE en .env}
      WORDPRESS_DB_USER: ${MARIADB_USER:?define MARIADB_USER en .env}
      WORDPRESS_DB_PASSWORD: ${MARIADB_PASSWORD:?define MARIADB_PASSWORD en .env}
      # The image's wp-config template defines WP_DEBUG from WORDPRESS_DEBUG
      # *before* evaluating WORDPRESS_CONFIG_EXTRA, so WP_DEBUG must be enabled
      # via WORDPRESS_DEBUG, never redefined in the extra block.
      WORDPRESS_DEBUG: 1
      # WORDPRESS_CONFIG_EXTRA is evaluated at runtime per container: keep it
      # duplicated in every PHP-running service (wordpress AND wpcli).
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_ENVIRONMENT_TYPE', 'local' );
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
    volumes:
      - wp_data:/var/www/html
      - ./wordpress/wp-content/themes/camino-del-dharma:/var/www/html/wp-content/themes/camino-del-dharma
      - ./wordpress/wp-content/plugins/camino-del-dharma-core:/var/www/html/wp-content/plugins/camino-del-dharma-core

  wpcli:
    image: wordpress:cli-2.12-php8.3
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${MARIADB_DATABASE:?define MARIADB_DATABASE en .env}
      WORDPRESS_DB_USER: ${MARIADB_USER:?define MARIADB_USER en .env}
      WORDPRESS_DB_PASSWORD: ${MARIADB_PASSWORD:?define MARIADB_PASSWORD en .env}
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_ENVIRONMENT_TYPE', 'local' );
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
    volumes:
      - wp_data:/var/www/html
      - ./wordpress/wp-content/themes/camino-del-dharma:/var/www/html/wp-content/themes/camino-del-dharma
      - ./wordpress/wp-content/plugins/camino-del-dharma-core:/var/www/html/wp-content/plugins/camino-del-dharma-core
      # Read-only migration inputs for `wp cdd-core migrate` / `seed`
      # (ADR 0032): the payload and the static tree it was extracted from.
      - ./migration:/repo/migration:ro
      - ./static:/repo/static:ro

volumes:
  db_data:
  wp_data:
